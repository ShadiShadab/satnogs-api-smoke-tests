name: smoke
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  # Write-method probes stay off in every CI run (push, pull request, manual).
  SATNOGS_ALLOW_WRITE_PROBES: "0"
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -m "not live" -q
  live:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -m "live and not slow" -q --junitxml=report.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: smoke-report, path: report.xml }
