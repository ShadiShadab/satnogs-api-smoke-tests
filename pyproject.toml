[project]
name = "satnogs-api-smoke-tests"
version = "0.1.0"
description = "Smoke tests for the public SatNOGS Network and DB APIs"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pytest>=8"]
license = {text = "AGPL-3.0-or-later"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "live: calls the public SatNOGS APIs over the internet",
    "negative: unauthenticated write-method probes; disabled by default, never run against public SatNOGS services",
    "slow: large responses; excluded by default, run with -m slow",
]
